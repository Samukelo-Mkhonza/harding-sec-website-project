name: Bug report
description: Report something that's broken on the site
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do **not** use this form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: page
    attributes:
      label: Page / route
      placeholder: "e.g. /university-applications"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: "e.g. Chrome 126 on Windows, Safari on iPhone 14"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if applicable.
    validations:
      required: false
