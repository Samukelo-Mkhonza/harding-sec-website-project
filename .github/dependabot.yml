# Keep dependencies and GitHub Actions patched automatically.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # npm dependencies (React app + build toolchain).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch minor/patch bumps into a single PR to cut review noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind v4 moved its PostCSS plugin to @tailwindcss/postcss and
      # dropped the @tailwind directives; react-scripts 5 hardcodes the
      # `tailwindcss` package as the PostCSS plugin, so v4 cannot build
      # under CRA. Stay on v3 until we migrate off react-scripts.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows/*.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
