# CodeQL static analysis (code scanning) for the React/JavaScript source.
# Results appear under Security > Code scanning alerts.
# https://docs.github.com/code-security/code-scanning
name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly full scan (Mondays 06:17 UTC) to catch newly published queries.
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload code-scanning results.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript-typescript" ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          language: ${{ matrix.language }}
          # "security-and-quality" adds maintainability queries on top of security.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          category: "/language:${{ matrix.language }}"
